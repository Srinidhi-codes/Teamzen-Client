name: AI Auto Fix (Aider + Groq)

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: ${{ vars.AI_AUTO_FIX_ENABLED == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Create working branch
        id: create-branch
        run: |
          BRANCH_NAME="fix/issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Run Aider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > aider-prompt.txt
          Please fix the following issue:
          Title: ${{ github.event.issue.title }}
          
          Description:
          ${{ github.event.issue.body }}
          
          Explore the repository, find the relevant files, and fix the bug. Do not modify unrelated code.
          EOF
          
          # Aider automatically commits changes when it successfully edits files
          aider --yes --message-file aider-prompt.txt --model groq/llama3-70b-8192

      - name: Push branch and Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push the branch Aider created commits on
          git push origin ${{ steps.create-branch.outputs.branch_name }}
          
          # Use GitHub CLI to create the Pull Request targeting V2-beta
          gh pr create \
            --title "Fix #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" \
            --body "Automated fix for issue #${{ github.event.issue.number }} generated by Aider (via Groq Llama 3). Please review the changes." \
            --base V2-beta \
            --head ${{ steps.create-branch.outputs.branch_name }}
